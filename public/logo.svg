<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Electric Cyan/Indigo Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Outer Decorative Concentric Ring -->
  <circle cx="256" cy="226" r="168" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6" />
  <circle cx="256" cy="226" r="156" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#softGlow)" />

  <!-- Sound Waves (Left) -->
  <rect x="136" y="200" width="8" height="52" rx="4" fill="url(#goldGrad)" opacity="0.75" />
  <rect x="150" y="176" width="8" height="100" rx="4" fill="url(#goldGrad)" opacity="0.9" />
  <rect x="164" y="152" width="8" height="148" rx="4" fill="url(#goldGrad)" />
  <rect x="178" y="186" width="8" height="80" rx="4" fill="url(#goldGrad)" opacity="0.85" />

  <!-- Sound Waves (Right) -->
  <rect x="326" y="186" width="8" height="80" rx="4" fill="url(#goldGrad)" opacity="0.85" />
  <rect x="340" y="152" width="8" height="148" rx="4" fill="url(#goldGrad)" />
  <rect x="354" y="176" width="8" height="100" rx="4" fill="url(#goldGrad)" opacity="0.9" />
  <rect x="368" y="200" width="8" height="52" rx="4" fill="url(#goldGrad)" opacity="0.75" />

  <!-- Center Circular Studio Core -->
  <circle cx="256" cy="226" r="64" fill="#030712" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldGlow)" />

  <!-- Microphone Element in Center -->
  <!-- Mic Capsule -->
  <rect x="242" y="178" width="28" height="52" rx="14" fill="url(#goldGrad)" />
  <!-- Capsule Lines -->
  <line x1="247" y1="194" x2="265" y2="194" stroke="#000000" stroke-width="2" opacity="0.5" />
  <line x1="246" y1="204" x2="266" y2="204" stroke="#000000" stroke-width="2" opacity="0.5" />

  <!-- Mic Arc Support -->
  <path d="M 228 208 C 228 248, 284 248, 284 208" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  <!-- Mic Base Stand -->
  <line x1="256" y1="240" x2="256" y2="262" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="240" y1="262" x2="272" y2="262" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Film Reel Notches / Video Frame Accents on Outer Ring -->
  <circle cx="256" cy="74" r="5" fill="#fef08a" />
  <circle cx="256" cy="378" r="5" fill="#fef08a" />
  <circle cx="104" cy="226" r="5" fill="#fef08a" />
  <circle cx="408" cy="226" r="5" fill="#fef08a" />

  <!-- Sparkles -->
  <path d="M 314 136 Q 320 148 332 152 Q 320 156 314 168 Q 308 156 296 152 Q 308 148 314 136 Z" fill="url(#goldGrad)" filter="url(#softGlow)" />
  <path d="M 198 126 Q 202 134 210 137 Q 202 140 198 148 Q 194 140 186 137 Q 194 134 198 126 Z" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Play Badge Floating on Bottom Right of Central Core -->
  <circle cx="304" cy="272" r="18" fill="#e11d48" stroke="#ffffff" stroke-width="2" filter="url(#softGlow)" />
  <polygon points="300,264 312,272 300,280" fill="#ffffff" />

  <!-- Ribbon Banner for Creator Tuy Chanthon -->
  <g transform="translate(0, 396)">
    <!-- Ribbon Shadow & Background -->
    <path d="M 68 34 L 110 8 L 402 8 L 444 34 L 402 60 L 110 60 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#softGlow)" />

    <!-- Ribbon Gold Accent Lines -->
    <line x1="118" y1="14" x2="394" y2="14" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />
    <line x1="118" y1="54" x2="394" y2="54" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />

    <!-- Ribbon Content: Creator Tuy Chanthon -->
    <text x="256" y="32" font-family="'Kantumruy Pro', sans-serif" font-size="14" font-weight="600" fill="#fde68a" text-anchor="middle">
      អ្នកបង្កើត: លោក ទុយ ចាន់ថន
    </text>
    <text x="256" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1.5">
      KHMER AI VIDEO DUBBER
    </text>
  </g>
</svg>
